name: PRUDEN Command CI

on:
  push:
    branches: ["main", "feature/**", "infra/**", "ptms/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Typecheck and production build
        run: npm run build
      - name: Agent tool permission tests
        run: node --test server/ai-workforce.test.mjs
      - name: Backend infrastructure smoke test
        run: node scripts/smoke-test.mjs
