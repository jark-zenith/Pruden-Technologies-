name: Ivy Twilio Communications CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - "server/ivy-twilio.mjs"
      - "server/ivy-twilio.test.mjs"
      - "server.mjs"
      - "supabase/migrations/**"
      - ".github/workflows/ivy-twilio-ci.yml"

permissions:
  contents: read

jobs:
  twilio-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run Ivy Twilio tests
        run: node --test server/ivy-twilio.test.mjs
      - name: Check backend syntax
        run: node --check server.mjs && node --check server/ivy-twilio.mjs
